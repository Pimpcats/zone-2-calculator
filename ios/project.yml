name: ZoneAlert
options:
  bundleIdPrefix: com.pimpcats
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  ZoneAlert:
    type: application
    platform: iOS
    sources:
      - path: ZoneAlert
    info:
      path: ZoneAlert/Info.plist
      properties:
        CFBundleDisplayName: Zone Alert
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - location
        NSBluetoothAlwaysUsageDescription: "Zone Alert connects to your heart-rate strap to track your training zones and alert you when you drop out of your target zone — including while the screen is locked."
        NSLocationWhenInUseUsageDescription: "Zone Alert uses GPS to measure your distance and pace during a workout."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Zone Alert tracks distance and pace in the background so your workout keeps recording while the screen is locked."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pimpcats.zonealert
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual

schemes:
  ZoneAlert:
    build:
      targets:
        ZoneAlert: all
    run:
      config: Debug
    archive:
      config: Release
