name: ZoneAlert
options:
  bundleIdPrefix: com.pimpcats
  deploymentTarget:
    iOS: "16.2"
  createIntermediateGroups: true

targets:
  ZoneAlert:
    type: application
    platform: iOS
    sources:
      - path: ZoneAlert
      - path: Shared
    dependencies:
      - target: ZoneAlertWidget
        embed: true
    info:
      path: ZoneAlert/Info.plist
      properties:
        CFBundleDisplayName: Zone Alert
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIconName: AppIcon
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - bluetooth-central
          - location
          - audio
        NSBluetoothAlwaysUsageDescription: "Zone Alert connects to your heart-rate strap to track your training zones and alert you when you drop out of your target zone — including while the screen is locked."
        NSLocationWhenInUseUsageDescription: "Zone Alert uses GPS to measure your distance and pace during a workout."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Zone Alert tracks distance and pace in the background so your workout keeps recording while the screen is locked."
        NSHealthShareUsageDescription: "Zone Alert can read your workouts from Apple Health."
        NSHealthUpdateUsageDescription: "Zone Alert can save your completed workouts to Apple Health."
        CFBundleURLTypes:
          - CFBundleURLName: com.pimpcats.zonealert.fitbit
            CFBundleURLSchemes:
              - zonealert
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pimpcats.zonealert
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Manual

  ZoneAlertWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: ZoneAlertWidget
      - path: Shared
    info:
      path: ZoneAlertWidget/Info.plist
      properties:
        CFBundleDisplayName: Zone Alert
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pimpcats.zonealert.widget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Manual

schemes:
  ZoneAlert:
    build:
      targets:
        ZoneAlert: all
    run:
      config: Debug
    archive:
      config: Release
